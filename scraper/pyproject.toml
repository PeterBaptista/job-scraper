[project]
name = "job-scraper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "aio-pika>=9.5.0",
    "seleniumbase>=4.34.0",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.4.10",
    "anthropic>=0.96.0",
    "pyvirtualdisplay>=3.0",
    "openai>=3.2.0",
    "pyyaml>=6.0.3",
    "pypdf>=6.16.1",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.8.0",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
